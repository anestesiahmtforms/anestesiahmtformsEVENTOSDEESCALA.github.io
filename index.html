<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos de Escala</title>
  <meta name="theme-color" content="#0d3257">
  <meta name="description" content="Eventos de Escala com correspondencia de ferias nas siglas por data.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260812-2">
</head>
<body>
  <div class="page-shell">
    <main class="app-frame">
      <section class="hero-card">
        <a
          class="hero-logo-wrap hero-logo-link"
          href="https://anestesiahmtforms.github.io/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir pagina Anestesia HMT Forms"
        >
          <img src="./sahmt_option1_clean.png" alt="Logo SAHMT" class="hero-logo">
        </a>
        <div class="hero-copy">
          <span class="hero-kicker">Eventos de Escala</span>
          <h1>SAHMT</h1>
        </div>
        <div class="hero-side-icon" aria-hidden="true">
          <img src="./gestao_operacional.png" alt="Gestao Operacional" class="hero-side-icon__image">
        </div>
      </section>

      <section id="scheduleCard" class="panel-card schedule-card">
        <section class="search-banner">
          <div class="card-header">
            <div>
              <p class="card-title">Buscar qualquer dia</p>
            </div>
            <p id="rangeLabel" class="range-label"></p>
          </div>

          <div id="outOfRangeNotice" class="notice hidden">
            A data escolhida nao esta na escala.
          </div>

          <div class="controls-grid">
            <label class="date-field" for="dateInput">
              <span>Data</span>
              <input id="dateInput" type="date">
            </label>

            <div class="quick-actions">
              <button id="prevButton" class="soft-button" type="button">Anterior</button>
              <button id="todayButton" class="primary-button" type="button">Hoje</button>
              <button id="nextButton" class="soft-button" type="button">Proximo</button>
            </div>
          </div>
        </section>

        <div class="schedule-top">
          <div>
            <p id="scheduleHeading" class="eyebrow"></p>
            <h2 id="formattedDate" class="date-title"></h2>
          </div>
          <span id="todayBadge" class="today-badge hidden">Hoje</span>
        </div>

        <div class="badge-row">
          <span id="weekdayBadge" class="capsule capsule-green"></span>
          <span class="capsule capsule-blue">Correspondencia de ferias nas siglas</span>
        </div>

        <div id="emptyState" class="empty-state hidden">
          Sem escala cadastrada para esta data.
        </div>

        <div id="siglasGrid" class="siglas-grid"></div>

        <section class="sub-banner vacation-banner">
          <div class="vacation-banner__actions">
            <a
              class="vacation-file-link vacation-file-link--scale"
              href="./escala-ferias-imagens.html"
              aria-label="Abrir escala e ferias 2026 em imagens"
            ><span class="vacation-file-link__scale">Escala</span><span class="vacation-file-link__vacation">/F&eacute;rias</span></a>
          </div>
        </section>
      </section>

      <footer class="footer-banner">
        By Francisco Tadeu da Mota Albuquerque
      </footer>
    </main>
  </div>

  <script src="./data.js?v=20260803-2"></script>
  <script src="./app.js?v=20260812-1"></script>
</body>
</html>
